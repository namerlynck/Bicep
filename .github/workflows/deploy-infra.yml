name: Deploy infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-Nathan-Amerlynck # your own resource group
  SERVICE_BUS_NAME: sb-Nathan-Amerlynck # your Service Bus namespace from Deploy Azure Resources
  FIRST_NAME: 'Nathan' # used in the names of all resources
  LAST_NAME: 'Amerlynck'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ format('{{"clientId":"{0}","clientSecret":"{1}","subscriptionId":"{2}","tenantId":"{3}"}}', secrets.AZURE_CLIENT_ID, secrets.AZURE_CLIENT_SECRET, secrets.AZURE_SUBSCRIPTION_ID, secrets.AZURE_TENANT_ID) }}

      - name: Preview changes (what-if)
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters serviceBusName="$SERVICE_BUS_NAME" firstName="$FIRST_NAME" lastName="$LAST_NAME"

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --name "infra-${{ github.run_number }}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters serviceBusName="$SERVICE_BUS_NAME" firstName="$FIRST_NAME" lastName="$LAST_NAME"
